entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

api:
  insecure: true

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      storage: /etc/traefik/acme/acme.json
      httpChallenge:
        entryPoint: web

accessLog:
  filePath: /var/log/traefik/access.log
  format: json

log:
  level: INFO
